name: Hooop desktop builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build"
        type: choice
        options: [all, mac, windows]
        default: all
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  mac:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'windows' }}
    name: macOS DMG (unsigned test build)
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build universal Hooop macOS package
        run: bash packaging/macos/make-app.sh --universal --dmg
      - name: Verify universal app, DMG, and embroidery exports
        run: |
          lipo -archs dist/Hooop.app/Contents/MacOS/zigzag-studio | grep -qw arm64
          lipo -archs dist/Hooop.app/Contents/MacOS/zigzag-studio | grep -qw x86_64
          hdiutil verify dist/Hooop-0.1.6.dmg
          dist/Hooop.app/Contents/MacOS/zigzag --help >/dev/null
          dist/Hooop.app/Contents/MacOS/zigzag convert examples/badge.svg --out "$RUNNER_TEMP/hooop-smoke.dst" --out "$RUNNER_TEMP/hooop-smoke.pes"
          test -s "$RUNNER_TEMP/hooop-smoke.dst"
          test -s "$RUNNER_TEMP/hooop-smoke.pes"
      - uses: actions/upload-artifact@v4
        with:
          name: Hooop-macOS-unsigned
          path: dist/Hooop-*.dmg
          if-no-files-found: error
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'mac' }}
    name: Windows x64 (unsigned test build)
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Compile original engine with Hooop native UI
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python packaging/windows/make-icon.py
          cargo build --locked --release --features gui,ble --bin zigzag-studio --bin zigzag --bin zigzag-mcp
          New-Item -ItemType Directory -Force dist/Hooop-windows | Out-Null
          Copy-Item target/release/zigzag-studio.exe dist/Hooop-windows/Hooop.exe
          Copy-Item target/release/zigzag.exe dist/Hooop-windows/zigzag-cli.exe
          Copy-Item target/release/zigzag-mcp.exe dist/Hooop-windows/zigzag-mcp.exe
          Copy-Item LICENSE,NOTICE,THIRD-PARTY-NOTICES.md dist/Hooop-windows/
          Compress-Archive -Path dist/Hooop-windows -DestinationPath dist/Hooop-windows-x64.zip
      - name: Verify real embroidery exports from compiled Windows CLI
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path "dist/Hooop-windows/Hooop.exe"))
          $optionalHeader = [BitConverter]::ToInt32($bytes, 0x3c) + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) { throw "Hooop.exe is not a Windows GUI subsystem executable (actual: $subsystem)" }
          & target/release/zigzag.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "CLI failed" }
          & target/release/zigzag.exe convert examples/badge.svg --out "$env:RUNNER_TEMP/hooop-smoke.dst" --out "$env:RUNNER_TEMP/hooop-smoke.pes"
          if ($LASTEXITCODE -ne 0) { throw "Native embroidery export failed" }
          if ((Get-Item "$env:RUNNER_TEMP/hooop-smoke.dst").Length -lt 100) { throw "DST output was empty" }
          if ((Get-Item "$env:RUNNER_TEMP/hooop-smoke.pes").Length -lt 100) { throw "PES output was empty" }
      - uses: actions/upload-artifact@v4
        with:
          name: Hooop-Windows-x64-unsigned
          path: dist/Hooop-windows-x64.zip
          if-no-files-found: error
